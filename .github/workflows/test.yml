name: Run tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint code
        run: python -m ruff check app.py tests

      - name: Check formatting
        run: python -m ruff format --check app.py tests

      - name: Run tests
        run: python -m pytest
